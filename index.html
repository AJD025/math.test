<!DOCTYPE html>
<html>
<head>
<style>
  /* YOUR CSS GOES HERE */
  body { background-color: black; margin: 0; color: white; font-family: sans-serif; }
  .card { 
    background: #1a1a1a; 
    padding: 30px; 
    border-radius: 15px; 
    border-top: 8px solid #f06d06; 
    margin: 20px;
    text-align: center;
  }
  .card h1 { color: red !important; }
  .card p { color: white; }
  button { padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>

  <div class="card">
    <h1>Math Study Project</h1>
    <p>This is my math study project.</p>
  </div>

  <div class="card">
    <h1>Math Challenge</h1>
    <p>Practice your speed!</p>
    <button id="gameBtn" onclick="playGame()">Start Game</button>
    <h2 id="scoreDisplay">Score: 0</h2>
  </div>

  <script>
    /* YOUR JS GOES HERE */
    let score = 0;
    function playGame() {
      score++;
      document.getElementById('scoreDisplay').innerHTML = "Score: " + score;
    }

    // Secret Teacher-is-Coming Key (Press 'B')
    document.addEventListener('keydown', function(e) {
      if (e.key.toLowerCase() === 'b') {
        document.body.innerHTML = "<h1>Mitosis Study Guide</h1><p>Prophase: Chromosomes condense...</p>";
        document.body.style.color = "white";
      }
    });
  </script>
</body>
</html>
