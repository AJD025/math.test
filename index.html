  <script>

    // Secret Teacher-is-Coming Key (Press 'B')
    document.addEventListener('keydown', function(e) {

    });
 <div style="text-align: center; color: white; font-family: sans-serif;">
    <h2 style="color: #ff4500;">Snake Arcade</h2>
    <p>Eat the red dots to grow!</p>
    <canvas id="snakeGame" width="300" height="300" style="border: 2px solid white; background-color: black;"></canvas>
    <h3 id="scoreDisplay">Score: 0</h3>
</div>

<script>
// 1. Setup variables
let score = 0;
const canvas = document.getElementById("snakeGame");
const ctx = canvas.getContext("2d");
let snake = [{x: 10, y: 10}];
let food = {x: 5, y: 5};
let dx = 1; // Starts moving right immediately
let dy = 0;

// 2. The Game Loop
function draw() {
    // Move the head
    let head = {x: snake[0].x + dx, y: snake[0].y + dy};
    
    // Check if snake hit walls (Game Over reset)
    if (head.x < 0 || head.x >= 15 || head.y < 0 || head.y >= 15) {
        snake = [{x: 10, y: 10}];
        score = 0;
        dx = 1; dy = 0;
        document.getElementById('scoreDisplay').innerHTML = "Score: 0";
        return;
    }

    snake.unshift(head);

    // Check if snake ate food
    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('scoreDisplay').innerHTML = "Score: " + score;
        food = {x: Math.floor(Math.random() * 15), y: Math.floor(Math.random() * 15)};
    } else {
        snake.pop();
    }

    // Draw everything
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 300, 300);
    
    ctx.fillStyle = "red";
    ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
    
    ctx.fillStyle = "white";
    snake.forEach(p => ctx.fillRect(p.x * 20, p.y * 20, 18, 18));
}

// 3. Controls
window.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
    if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
    if (e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
    if (e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
});

// 4. Start the game loop automatically
setInterval(draw, 150);
</script>
